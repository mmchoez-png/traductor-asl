<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Translator Mobile - Light Mode</title>
    <style>
        /* RESET BÁSICO */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            /* Fondo suave y profesional (off-white) */
            background-color: #f4f7f6;
            /* Texto oscuro para legibilidad */
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* TARJETA PRINCIPAL (Blanca con sombra suave) */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); /* Sombra muy sutil */
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* ENCABEZADO */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .header-icon {
            font-size: 1.5rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            /* Azul cerceta profesional */
            color: #0369a1;
        }

        /* SECCIÓN DE CARGA DE ARCHIVO */
        .file-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
        }

        .file-box label {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        /* Estilo para el input file nativo */
        input[type="file"] {
            width: 100%;
            font-size: 0.85rem;
            color: #333;
        }
        
        input[type="file"]::file-selector-button {
            background-color: #0369a1; /* Mismo azul profesional */
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #0284c7;
        }

        /* CONTENEDOR DE CÁMARA (Canvas) */
        .canvas-container {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #e2e8f0; /* Fondo gris claro antes de la cámara */
            aspect-ratio: 4 / 3; /* Mantiene la proporción */
            border: 2px solid #e2e8f0;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            transform: scaleX(-1); /* Efecto espejo */
            object-fit: cover;
        }

        video { display: none; } /* El video se oculta, usamos el canvas */

        /* BOTÓN DE INICIO (Cuando reaparece) */
        .btn-start {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            background-color: #16a34a; /* Verde amigable */
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-start:active {
            transform: translateY(1px);
            background-color: #15803d;
        }

        /* SECCIÓN DE RESULTADOS */
        .result-box {
            background: #e0f2fe; /* Azul pastel muy suave */
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #bae6fd;
        }

        .result-title {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .result-letter {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0369a1; /* Azul profesional */
        }
        
        #txtStatus {
            font-size: 1rem;
            font-weight: 600;
            color: #64748b;
        }

        /* DIAGNÓSTICO (Opcional, en amarillo suave) */
        #debug {
            font-size: 0.75rem;
            color: #a16207;
            margin-top: 10px;
            word-break: break-all;
            background: #fef9c3;
            padding: 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-container">
            <span class="header-icon">📱</span>
            <h2>Traductor ASL Móvil</h2>
        </div>
        
        <!-- Botón para reiniciar si algo sale mal o para iniciar primera vez -->
        <button id="btnInit" class="btn-start" onclick="iniciarSistema()">▶️ Iniciar Cámara y Audio</button>
        
        <div class="file-box">
            <label>1. Carga tu dataset JSON:</label>
            <input type="file" id="fileInput" accept=".json">
        </div>

        <div class="canvas-container">
            <video id="webcam" playsinline autoplay muted></video>
            <canvas id="output_canvas" width="480" height="360"></canvas>
        </div>

        <div class="result-box">
            <div class="result-title">ESTADO / LETRA</div>
            <div id="txtResult" class="result-letter">Cargando modelo...</div>
        </div>

        <div id="debug">Iniciando sistema...</div>
    </div>

    <!-- Librerías JS (Mismas de antes) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>

    <script>
        // --- TODA LA LÓGICA JS PERMANECE IGUAL (FUNCIONA PERFECTO) ---
        let classifier, hands, camera;
        let modeloCargado = false;
        let lastSpoken = "", lastTime = 0;

        function log(msg) { document.getElementById('debug').innerText = msg; }

        async function initML() {
            classifier = knnClassifier.create();
            log("Buscando asl_dataset_v2.json...");
            try {
                const response = await fetch('asl_dataset_v2.json');
                if (response.ok) {
                    const dataset = await response.json();
                    cargarDatasetEnModelo(dataset);
                } else {
                    log("Aviso: No se encontró carga automática. Usa el botón.");
                    document.getElementById('txtResult').innerText = "Carga el dataset...";
                }
            } catch (e) { log("Carga manual requerida."); }
        }
        initML();

        function cargarDatasetEnModelo(dataset) {
            classifier.clearAllClasses();
            dataset.forEach(item => {
                const tensor = tf.tensor2d([item.features], [1, 210]);
                classifier.addExample(tensor, item.label);
                tensor.dispose();
            });
            modeloCargado = true;
            document.getElementById('txtResult').innerText = "¡Modelo listo!";
            log("Dataset cargado (" + dataset.length + " muestras)");
            speak("System ready");
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try { cargarDatasetEnModelo(JSON.parse(evt.target.result)); }
                catch (err) { alert("Error en el archivo JSON"); }
            };
            reader.readAsText(file);
        });

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'en-US';
                window.speechSynthesis.speak(msg);
            }
        }

        function extraerMatrizDistancias(landmarks) {
            const wrist = landmarks[0], middleMcp = landmarks[9];
            const scale = Math.hypot(wrist.x - middleMcp.x, wrist.y - middleMcp.y, (wrist.z || 0) - (middleMcp.z || 0)) || 1;
            const features = [];
            for (let i = 0; i < landmarks.length; i++) {
                for (let j = i + 1; j < landmarks.length; j++) {
                    const dx = landmarks[i].x - landmarks[j].x;
                    const dy = landmarks[i].y - landmarks[j].y;
                    const dz = (landmarks[i].z || 0) - (landmarks[j].z || 0);
                    features.push(Math.hypot(dx, dy, dz) / scale);
                }
            }
            return features;
        }

        async function iniciarSistema() {
            document.getElementById('btnInit').style.display = 'none'; // Ocultar botón al iniciar
            log("Solicitando permisos de cámara...");
            speak("Initializing camera");

            const videoElement = document.getElementById('webcam');
            const canvasElement = document.getElementById('output_canvas');
            const canvasCtx = canvasElement.getContext('2d');

            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

            hands.onResults(async (results) => {
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#0ea5e9', lineWidth: 3}); // Azul brillante
                    drawLandmarks(canvasCtx, landmarks, {color: '#f97316', lineWidth: 1, radius: 2}); // Naranja

                    if (modeloCargado) {
                        const features = extraerMatrizDistancias(landmarks);
                        const tensor = tf.tensor2d([features], [1, 210]);
                        const result = await classifier.predictClass(tensor);
                        tensor.dispose();

                        let letter = result.label;
                        let conf = Math.round((result.confidences[letter] || 0) * 100);
                        document.getElementById('txtResult').innerText = `Letra ${letter} (${conf}%)`;

                        const now = Date.now();
                        if ((letter !== lastSpoken || now - lastTime > 2500) && conf >= 60) {
                            speak(`Letter ${letter}`);
                            lastSpoken = letter;
                            lastTime = now;
                        }
                    }
                } else {
                    if (modeloCargado) document.getElementById('txtResult').innerText = "Muestra tu mano...";
                }
                canvasCtx.restore();
            });

            camera = new Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 480, height: 360, facingMode: "user"
            });
            camera.start()
                .then(() => log("Cámara activa y transmitiendo."))
                .catch(e => {
                    log("Error crítica de cámara: " + e.message);
                    document.getElementById('btnInit').style.display = 'block'; // Reaparecer botón si falla
                });
        }
    </script>
</body>
</html>
