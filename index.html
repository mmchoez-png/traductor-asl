<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Translator Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #12121c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        h2 { font-size: 1.4rem; margin-bottom: 10px; color: #00d2d3; text-align: center; }
        .card {
            background: #1e1e2f;
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }
        video { display: none; }
        .result-box {
            margin-top: 15px;
            background: #27273e;
            padding: 12px;
            border-radius: 10px;
        }
        .result-title { font-size: 0.85rem; color: #aaa; text-transform: uppercase; }
        .result-letter { font-size: 1.8rem; font-weight: bold; color: #00d2d3; margin-top: 2px; }
        .btn-start {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .file-box {
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #ccc;
            background: #2d2d44;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>📱 Traductor ASL Móvil</h2>
        
        <button id="btnInit" class="btn-start" onclick="iniciarSistema()">▶️ Iniciar Cámara y Audio</button>
        
        <div class="file-box">
            <label><b>1. Carga tu dataset JSON:</b></label><br>
            <input type="file" id="fileInput" accept=".json" style="margin-top: 8px; width: 100%;">
        </div>

        <div class="canvas-container">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="output_canvas" width="480" height="360"></canvas>
        </div>

        <div class="result-box">
            <div class="result-title">Estado / Letra</div>
            <div id="txtResult" class="result-letter">Carga el dataset primero</div>
        </div>
    </div>

    <!-- Librerías JS -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>

    <script>
        let classifier, hands;
        let modeloCargado = false;
        let lastSpokenLetter = "";
        let lastSpokenTime = 0;

        async function initML() {
            classifier = knnClassifier.create();
            try {
                const response = await fetch('asl_dataset_v2.json');
                if (response.ok) {
                    const dataset = await response.json();
                    cargarDatasetEnModelo(dataset);
                }
            } catch (e) {
                console.log("Carga manual requerida");
            }
        }
        initML();

        function cargarDatasetEnModelo(dataset) {
            classifier.clearAllClasses();
            dataset.forEach(item => {
                const tensor = tf.tensor2d([item.features], [1, 210]);
                classifier.addExample(tensor, item.label);
                tensor.dispose();
            });
            modeloCargado = true;
            document.getElementById('txtResult').innerText = "¡Modelo listo! Pulsa Iniciar";
            speakEnglish("Dataset loaded successfully");
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    cargarDatasetEnModelo(JSON.parse(evt.target.result));
                } catch (err) {
                    alert("Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
        });

        function speakEnglish(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'en-US';
                msg.rate = 1.0;
                window.speechSynthesis.speak(msg);
            }
        }

        function extraerMatrizDistancias(landmarks) {
            const wrist = landmarks[0], middleMcp = landmarks[9];
            const scale = Math.hypot(wrist.x - middleMcp.x, wrist.y - middleMcp.y, (wrist.z || 0) - (middleMcp.z || 0)) || 1;
            const features = [];
            for (let i = 0; i < landmarks.length; i++) {
                for (let j = i + 1; j < landmarks.length; j++) {
                    const dx = landmarks[i].x - landmarks[j].x;
                    const dy = landmarks[i].y - landmarks[j].y;
                    const dz = (landmarks[i].z || 0) - (landmarks[j].z || 0);
                    features.push(Math.hypot(dx, dy, dz) / scale);
                }
            }
            return features;
        }

        async function iniciarSistema() {
            speakEnglish("Camera active");
            document.getElementById('btnInit').style.display = 'none';

            const videoElement = document.getElementById('webcam');
            const canvasElement = document.getElementById('output_canvas');
            const canvasCtx = canvasElement.getContext('2d');

            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.75,
                minTrackingConfidence: 0.75
            });

            hands.onResults(async (results) => {
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 2});

                    if (modeloCargado) {
                        const features = extraerMatrizDistancias(landmarks);
                        const tensor = tf.tensor2d([features], [1, 210]);
                        const result = await classifier.predictClass(tensor);
                        tensor.dispose();

                        let letter = result.label;
                        let conf = Math.round((result.confidences[letter] || 0) * 100);

                        document.getElementById('txtResult').innerText = `Letra ${letter} (${conf}%)`;

                        const now = Date.now();
                        if ((letter !== lastSpokenLetter || now - lastSpokenTime > 2500) && conf >= 60) {
                            speakEnglish(`Letter ${letter}`);
                            lastSpokenLetter = letter;
                            lastSpokenTime = now;
                        }
                    } else {
                        document.getElementById('txtResult').innerText = "Carga el dataset JSON...";
                    }
                } else {
                    if (modeloCargado) document.getElementById('txtResult').innerText = "Muestra tu mano...";
                }
                canvasCtx.restore();
            });

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                videoElement.srcObject = stream;
                await videoElement.play();

                async function processFrame() {
                    if (!videoElement.paused && !videoElement.ended) {
                        await hands.send({ image: videoElement });
                    }
                    requestAnimationFrame(processFrame);
                }
                processFrame();
            } catch (err) {
                alert("Error al acceder a la cámara: " + err.message);
            }
        }
    </script>
</body>
</html>
